[project]
name = "tracker"
version = "0.1.0"
description = "Tracking service for agentic harness"
authors = [
    { name = "Omar Almatov", email = "52346350+oalmatov@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.42.20",
    "daytona>=0.128.1",
    "fastapi[standard]>=0.127.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
reportMissingTypeStubs=false
reportUnknownMemberType=false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

